name: Desktop qualification
permissions:
  contents: write
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  unit:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
  windows-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --test test/e2e/browser.test.js
      - run: pnpm dist
      - run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item ../windows/DREAM-Browser-Setup-0.1.0.exe dist/
      - uses: actions/upload-artifact@v4
        with:
          name: DREAM-Windows
          path: dist/*.exe
      - name: Publish Windows preview
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view v0.1.0-preview 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create v0.1.0-preview dist/DREAM-Browser-Setup-0.1.0.exe --target ${{ github.sha }} --title "DREAM Browser 0.1.0 preview" --notes "Unsigned Windows preview. Chrome extension compatibility is partial; Android is not yet available." --prerelease
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

