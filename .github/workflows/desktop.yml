name: Desktop qualification
permissions:
  contents: write
on:
  workflow_dispatch:
  push:
    branches: [main, ai-animation-polish]
jobs:
  unit:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
  windows-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --test test/e2e/browser.test.js
      - uses: actions/upload-artifact@v4
        with:
          name: DREAM-UI-test
          path: test-results/*.png
          if-no-files-found: warn
      - run: pnpm dist
      - run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item ../windows/DREAM-Browser-Setup-0.1.1.exe dist/
      - uses: actions/upload-artifact@v4
        with:
          name: DREAM-Windows
          path: dist/*.exe
      - name: Publish Windows preview
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view v0.1.1-preview 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create v0.1.1-preview dist/DREAM-Browser-Setup-0.1.1.exe --target ${{ github.sha }} --title "DREAM Browser 0.1.1 preview" --notes "Unsigned Windows preview with a stricter Chrome Web Store origin check. Chrome extension compatibility is partial; Android is not yet available." --prerelease
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
  macos-package:
    if: github.ref == 'refs/heads/main'
    needs: windows-package
    runs-on: macos-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:preload
      - run: node --test test/e2e/browser.test.js
      - run: sips -z 1024 1024 build/icon.png
      - run: pnpm exec electron-builder --mac dmg --x64 --arm64 --publish never
      - run: mkdir -p dist && cp ../windows/*.dmg dist/
      - uses: actions/upload-artifact@v4
        with:
          name: DREAM-macOS
          path: dist/*.dmg
          if-no-files-found: error
      - name: Publish macOS preview
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v0.1.1-preview dist/*.dmg --clobber
          gh release edit v0.1.1-preview --notes 'Unsigned Windows and macOS previews with a stricter Chrome Web Store origin check. macOS builds are not notarized and may be blocked by Gatekeeper. Chrome extension compatibility is partial; Android is not yet available.'
